<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaPDF — Made by Dreoxis</title>

<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #2a2a2a;
    --text: #eeeeee;
    --muted: #8a8a8a;
    --accent: #e2231a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  header {
    position: relative;
    padding: 40px 24px 30px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }

  header h1 {
    font-size: 2.2rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  header h1 span {
    color: var(--accent);
  }

  .creator {
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0;
    text-transform: none;
    margin-left: 8px;
    vertical-align: middle;
    font-weight: normal;
  }

  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 0.95rem;
  }

  /* APP SWITCHER (sliding bar, top right) */

  .app-toggle-wrapper {
    position: absolute;
    top: 40px;
    right: 24px;
  }

  .app-toggle {
    position: relative;
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
  }

  .app-toggle-knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
  }

  .app-toggle[data-active="anime"] .app-toggle-knob {
    transform: translateX(100%);
  }

  .app-toggle-option {
    position: relative;
    z-index: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 16px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 999px;
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .app-toggle-option.active {
    color: white;
  }

  /* LANGUAGE BUTTONS */

  .language-switcher {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 22px auto 0;
  }

  .language-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 18px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: 0.15s ease;
  }

  .language-btn:hover {
    border-color: #555;
    color: var(--text);
  }

  .language-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* SEARCH */

  .search-bar {
    max-width: 420px;
    margin: 22px auto 0;
    display: flex;
  }

  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    font-size: 0.9rem;
  }

  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* MAIN */

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* GRID */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 28px;
  }

  /* CARD */

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition:
      border-color 0.15s ease,
      transform 0.15s ease;
  }

  .card:hover {
    border-color: #444;
    transform: translateY(-3px);
  }

  /* COVER */

  .cover {
    aspect-ratio: 3 / 4;
    width: 100%;
    background: #1c1c1c;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;

    overflow: hidden;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* INFO */

  .info {
    padding: 16px;

    display: flex;
    flex-direction: column;
    gap: 8px;

    flex: 1;
  }

  .info h2 {
    font-size: 1.05rem;
    letter-spacing: 0.3px;
  }

  .info p {
    color: var(--muted);
    font-size: 0.85rem;
    flex: 1;
  }

  /* DOWNLOAD */

  .download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    margin-top: 8px;
    padding: 10px 14px;

    background: transparent;
    border: 1px solid var(--accent);

    color: var(--accent);
    text-decoration: none;

    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;

    transition:
      background 0.15s ease,
      color 0.15s ease;
  }

  .download:hover {
    background: var(--accent);
    color: #0a0a0a;
  }

  /* EMPTY */

  .empty {
    grid-column: 1 / -1;

    text-align: center;
    color: var(--muted);

    padding: 40px 0;
  }

  /* FOOTER */

  footer {
    text-align: center;
    color: var(--muted);

    font-size: 0.8rem;

    padding: 24px;

    border-top: 1px solid var(--border);
  }

  /* MOBILE */

  @media (max-width: 650px) {

    header h1 {
      font-size: 1.7rem;
    }

    main {
      padding-left: 16px;
      padding-right: 16px;
    }

    .app-toggle-wrapper {
      position: static;
      margin: 18px auto 0;
      display: flex;
      justify-content: center;
    }

  }
</style>
</head>

<body>

<header>

  <!-- APP SWITCHER -->

  <div class="app-toggle-wrapper">

    <div
      class="app-toggle"
      id="appToggle"
      data-active="manga"
    >

      <div class="app-toggle-knob"></div>

      <button
        class="app-toggle-option active"
        id="mangaAppBtn"
        onclick="switchApp('manga')"
      >
        MangaPDF
      </button>

      <button
        class="app-toggle-option"
        id="animeAppBtn"
        onclick="switchApp('anime')"
      >
        AnimeMP4
      </button>

    </div>

  </div>

  <h1>
    <span id="titlePart1">Manga</span><span id="titlePart2">PDF</span>
    <small class="creator">Made by Dreoxis</small>
  </h1>

  <p id="subtitle">
    Une petite bibliothèque de mangas à télécharger en PDF.
  </p>

  <!-- LANGUAGE SWITCHER -->

  <div class="language-switcher">

    <button
      class="language-btn active"
      id="frBtn"
      onclick="changeLanguage('fr')"
    >
      🇫🇷 Français
    </button>

    <button
      class="language-btn"
      id="enBtn"
      onclick="changeLanguage('en')"
    >
      🇬🇧 English
    </button>

  </div>

  <!-- SEARCH -->

  <div class="search-bar">

    <input
      type="text"
      id="search"
      placeholder="Rechercher un titre..."
    >

  </div>

</header>


<main>

  <div
    class="grid"
    id="grid"
  ></div>

</main>


<footer id="footer">

  Fait avec ❤ — pense à respecter les droits d'auteur des œuvres que tu partages.

</footer>


<script>

  // =========================================================
  // BIBLIOTHÈQUE ANGLAISE (MANGA) 
  // =========================================================

  const mangasEN = [

    {
      title: "Goodbye, Eri",
      description: "Random BS",
      cover: "covers/goodbye-eri-cover.jpg",
      pdf: "pdfs/Eng/goodbye-eri.pdf"
    },

    {
      title: "Naruto Volume 1",
      description: "A young ninja rejected by his village dreams of becoming Hokage.",
      cover: "covers/narutocover.jpg",
      pdf: "pdfs/Eng/Naruto-Volume-01.pdf"
    },

    {
      title: "Berserk Volume 1",
      description: "Guts, the Black Swordsman, faces his destiny in a dark and brutal world.",
      cover: "covers/Berserkcover.jpg",
      pdf: "pdfs/Eng/Berserkvolume-1.pdf"
    }

  ];


  // =========================================================
  // BIBLIOTHÈQUE FRANÇAISE (MANGA)
  // =========================================================

  const mangasFR = [

    {
     title: "Naruto Tome 1",
     description: "Un jeune ninja rejeté par son village rêve de devenir Hokage.",
     cover: "covers/narutocover.jpg",
     pdf: "pdfs/Fr/Naruto-vol1-Fr.pdf"
    },

    {
      title: "Sbr Tome 1",
      description: "Steel Ball Run suit Johnny Joestar, un ancien jockey paralysé, qui participe à une course à travers les États-Unis.",
      cover: "covers/JojoSteelBallRunCover.jpg",
      pdf: "pdfs/Fr/Sbr-vol1.pdf"
    },

    {
      title: "Sbr Tome 2",
      description: "Steel Ball Run suit Johnny Joestar, un ancien jockey paralysé, qui participe à une course à travers les États-Unis.",
      cover: "covers/sbr2.jpg",
      pdf: "pdfs/Fr/Sbr-Tome2.pdf"
    },

  ];


  // =========================================================
  // BIBLIOTHÈQUE ANGLAISE (ANIME)
  // Pour ajouter un épisode, copie ce modèle dans le tableau :
  // {
  //   title: "Nom de l'épisode",
  //   description: "Résumé de l'épisode.",
  //   cover: "covers/nom-cover.jpg",
  //   video: "mp4/En/nom-episode.mp4"
  // }
  // =========================================================

  const animeEN = [
    
    {
     title: "Naruto Vol 1",
     description: "Un jeune ninja rejeté par son village rêve de devenir Hokage.",
     cover: "covers/narutocover.jpg",
     pdf: "pdfs/Fr/Naruto-vol1-Fr.pdf"
    },

  ];


  // =========================================================
  // BIBLIOTHÈQUE FRANÇAISE (ANIME)
  // Même modèle que ci-dessus, à remplir toi-même sur GitHub.
  // =========================================================

  const animeFR = [
    
    {
     title: "Naruto Ep1",
     description: "Un jeune ninja rejeté par son village rêve de devenir Hokage.",
     cover: "covers/narutocover.jpg",
     pdf: "Episode/NarutoVf1.mp4"
    },

  ];


  // =========================================================
  // TRADUCTIONS
  // =========================================================

  const translations = {

    fr: {
      subtitleManga:
        "Une petite bibliothèque de mangas à télécharger en PDF.",

      subtitleAnime:
        "Une petite bibliothèque d'épisodes à télécharger en MP4.",

      search:
        "Rechercher un titre...",

      downloadManga:
        "Télécharger le PDF",

      downloadAnime:
        "Télécharger l'épisode",

      emptyManga:
        "Aucun manga trouvé.",

      emptyAnime:
        "Aucun épisode pour le moment. Ajoute le premier ci-dessus !",

      noCover:
        "Pas de couverture",

      footer:
        "Fait avec ❤ — pense à respecter les droits d'auteur des œuvres que tu partages."
    },

    en: {
      subtitleManga:
        "A small manga library available to download as PDF.",

      subtitleAnime:
        "A small episode library available to download as MP4.",

      search:
        "Search for a title...",

      downloadManga:
        "Download PDF",

      downloadAnime:
        "Download episode",

      emptyManga:
        "No manga found.",

      emptyAnime:
        "No episodes yet. Add the first one above!",

      noCover:
        "No cover",

      footer:
        "Made with ❤ — please respect the copyrights of the works you share."
    }

  };


  // =========================================================
  // VARIABLES
  // =========================================================

  let currentLanguage = "fr";
  let currentApp = "manga";

  const grid =
    document.getElementById("grid");

  const searchInput =
    document.getElementById("search");

  const subtitle =
    document.getElementById("subtitle");

  const footer =
    document.getElementById("footer");

  const frBtn =
    document.getElementById("frBtn");

  const enBtn =
    document.getElementById("enBtn");

  const titlePart1 =
    document.getElementById("titlePart1");

  const titlePart2 =
    document.getElementById("titlePart2");

  const appToggle =
    document.getElementById("appToggle");

  const mangaAppBtn =
    document.getElementById("mangaAppBtn");

  const animeAppBtn =
    document.getElementById("animeAppBtn");


  // =========================================================
  // LISTE ACTUELLE (selon app + langue)
  // =========================================================

  function getCurrentList() {

    if (currentApp === "manga") {

      return currentLanguage === "fr" ? mangasFR : mangasEN;

    }

    return currentLanguage === "fr" ? animeFR : animeEN;

  }


  // =========================================================
  // CHANGER D'APP (MangaPDF <-> AnimeMP4)
  // =========================================================

  function switchApp(app) {

    currentApp = app;

    appToggle.dataset.active = app;

    mangaAppBtn.classList.toggle("active", app === "manga");
    animeAppBtn.classList.toggle("active", app === "anime");

    if (app === "manga") {

      titlePart1.textContent = "Manga";
      titlePart2.textContent = "PDF";

    } else {

      titlePart1.textContent = "Anime";
      titlePart2.textContent = "MP4";

    }

    applyTranslations();

    searchInput.value = "";

    render(getCurrentList());

  }


  // =========================================================
  // CHANGER DE LANGUE
  // =========================================================

  function changeLanguage(language) {

    currentLanguage = language;

    if (language === "fr") {

      frBtn.classList.add("active");
      enBtn.classList.remove("active");

      document.documentElement.lang = "fr";

    } else {

      enBtn.classList.add("active");
      frBtn.classList.remove("active");

      document.documentElement.lang = "en";

    }

    applyTranslations();

    searchInput.value = "";

    render(getCurrentList());

  }


  // =========================================================
  // APPLIQUER LES TRADUCTIONS (selon app + langue)
  // =========================================================

  function applyTranslations() {

    const t =
      translations[currentLanguage];

    subtitle.textContent =
      currentApp === "manga" ? t.subtitleManga : t.subtitleAnime;

    searchInput.placeholder =
      t.search;

    footer.textContent =
      t.footer;

  }


  // =========================================================
  // AFFICHER LA LISTE (manga ou anime)
  // =========================================================

  function render(list) {

    grid.innerHTML = "";

    const t =
      translations[currentLanguage];

    const emptyMessage =
      currentApp === "manga" ? t.emptyManga : t.emptyAnime;

    const downloadLabel =
      currentApp === "manga" ? t.downloadManga : t.downloadAnime;

    const fileField =
      currentApp === "manga" ? "pdf" : "video";


    if (list.length === 0) {

      grid.innerHTML = `
        <div class="empty">
          ${emptyMessage}
        </div>
      `;

      return;

    }


    list.forEach(m => {

      const card =
        document.createElement("div");

      card.className = "card";


      const coverHtml = m.cover

        ? `
          <img
            src="${m.cover}"
            alt="Cover de ${m.title}"
          >
        `

        : t.noCover;


      card.innerHTML = `

        <div class="cover">

          ${coverHtml}

        </div>


        <div class="info">

          <h2>
            ${m.title}
          </h2>


          <p>
            ${m.description}
          </p>


          <a
            class="download"
            href="${m[fileField]}"
            download
          >
            ${downloadLabel}
          </a>

        </div>

      `;


      grid.appendChild(card);

    });

  }


  // =========================================================
  // RECHERCHE
  // =========================================================

  searchInput.addEventListener(
    "input",
    () => {

      const q =
        searchInput.value
          .toLowerCase()
          .trim();


      const filtered =
        getCurrentList().filter(m =>

          m.title
            .toLowerCase()
            .includes(q)

          ||

          m.description
            .toLowerCase()
            .includes(q)

        );


      render(filtered);

    }
  );


  // =========================================================
  // INITIALISATION
  // =========================================================

  render(mangasFR);

</script>

</body>
</html>
