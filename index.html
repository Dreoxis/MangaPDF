<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque Manga</title>
<style>
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --border:#2a2a2a;
    --text:#eeeeee;
    --muted:#8a8a8a;
    --accent:#e2231a; /* rouge encre, clin d'œil au tampon "hors-série" des mangas */
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Helvetica Neue", Arial, sans-serif;
    line-height:1.5;
  }

  header{
    padding:48px 24px 32px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }

  header h1{
    font-size:2.2rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  header h1 span{
    color:var(--accent);
  }

  header p{
    color:var(--muted);
    margin-top:8px;
    font-size:0.95rem;
  }

  .search-bar{
    max-width:420px;
    margin:24px auto 0;
    display:flex;
  }

  .search-bar input{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-right:none;
    color:var(--text);
    padding:10px 14px;
    font-size:0.9rem;
  }

  .search-bar input:focus{
    outline:none;
    border-color:var(--accent);
  }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 80px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:28px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:border-color .15s ease, transform .15s ease;
  }

  .card:hover{
    border-color:#444;
    transform:translateY(-3px);
  }

  .cover{
    aspect-ratio:3/4;
    width:100%;
    background:#1c1c1c;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:0.8rem;
    letter-spacing:1px;
    text-transform:uppercase;
    overflow:hidden;
  }

  .cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .info{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }

  .info h2{
    font-size:1.05rem;
    letter-spacing:0.3px;
  }

  .info p{
    color:var(--muted);
    font-size:0.85rem;
    flex:1;
  }

  .download{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:8px;
    padding:10px 14px;
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    text-decoration:none;
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:background .15s ease, color .15s ease;
  }

  .download:hover{
    background:var(--accent);
    color:#0a0a0a;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    padding:24px;
    border-top:1px solid var(--border);
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    color:var(--muted);
    padding:40px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Manga<span>Vault</span></h1>
  <p>Une petite bibliothèque de mangas à télécharger en PDF.</p>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Rechercher un titre...">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Fait avec ❤ — pense à respecter les droits d'auteur des œuvres que tu partages.
</footer>

<script>
  // ---------------------------------------------------------
  // Ajoute / modifie tes mangas ici. Un objet = une carte.
  // - cover : URL d'une image de couverture (laisse vide "" pour un placeholder)
  // - pdf   : chemin ou URL vers le fichier PDF à télécharger
  // ---------------------------------------------------------
  const mangas = [
    {
      title: "Goodbye, Eri",
      description: "Random BS",
      cover: "covers/goodbye-eri-cover.jpg",
      pdf: "pdfs/goodbye-eri.pdf"
    },
    {
      title: "Naruto Volume 1",
      description: "Un jeune ninja rejeté par son village rêve de devenir Hokage.",
      cover: "covers/narutocover.jpg",
      pdf: "pdfs/Naruto-Volume-01.pdf"
    },
    {
      title: "Berserk Volume 1",
      description: "Guts, le guerrier noir, affronte son destin dans un monde sombre et brutal.",
      cover: "covers/Berserkcover.jpg",
      pdf: "pdfs/Berserkvolume-1.pdf"
    }
  ];

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("search");

  function render(list){
    grid.innerHTML = "";
    if(list.length === 0){
      grid.innerHTML = '<div class="empty">Aucun manga trouvé.</div>';
      return;
    }
    list.forEach(m => {
      const card = document.createElement("div");
      card.className = "card";

      const coverHtml = m.cover
        ? `<img src="${m.cover}" alt="Couverture de ${m.title}">`
        : "Pas de couverture";

      card.innerHTML = `
        <div class="cover">${coverHtml}</div>
        <div class="info">
          <h2>${m.title}</h2>
          <p>${m.description}</p>
          <a class="download" href="${m.pdf}" download>Télécharger le PDF</a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.toLowerCase();
    render(mangas.filter(m => m.title.toLowerCase().includes(q)));
  });

  render(mangas);
</script>

</body>
</html>
